name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # package.json exige >=22.0.0 en engines; 22 funciona con el toolchain
          # actual (Vite 6 / Vitest 2 / TypeScript 5.8). Subir a 24 cuando
          # el runner de Actions lo soporte estable.
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run typecheck
      - run: npm test
      - run: npm run build
