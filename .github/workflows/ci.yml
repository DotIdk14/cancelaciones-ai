name: CI

on:
  pull_request:
  push:
    branches: [main]

# Una sola ejecución por rama/PR: la nueva cancela a la anterior pendiente.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Mínimo privilegio. Ningún job de este workflow escribe en el repo ni
# expone tokens: los 358 tests usan stores fake y no requieren claves externas.
permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # SHAs de commit pineados a la última release v4 de cada action
      # (requisito de supply chain; zizmor `unpinned-actions`).
      # persist-credentials: false → el runner no deja el token de GitHub
      # en el working copy: este workflow no hace push ni sube artefactos.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          # package.json exige >=22.0.0 en engines; 22 funciona con el toolchain
          # actual (Vite 6 / Vitest 2 / TypeScript 5.8). Subir a 24 cuando
          # el runner de Actions lo soporte estable.
          node-version: 22
          cache: npm

      - run: npm ci

      # verify:release encadena lint de secretos (check-no-public-secrets.mjs),
      # typecheck, contract tests de OpenRouter/schema, suite Vitest completa y
      # build. Se ejecuta sin inyectar secretos: ver package.json -> scripts.
      - run: npm run verify:release
